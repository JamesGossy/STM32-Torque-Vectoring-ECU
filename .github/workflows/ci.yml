# Builds the STM32 firmware, runs the host tests on Linux and Windows, runs the real
# motor controller firmware against the ECU, and drives the Formula Student
# simulator's lap matrix with this firmware in the loop.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  firmware:
    name: STM32G474 firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build clang-format
      - name: Format check
        run: make format-check
      - name: Build
        run: make firmware
      - uses: actions/upload-artifact@v4
        with:
          name: tv_ecu-firmware
          path: |
            ECU_Firmware/build/tv_ecu.elf
            ECU_Firmware/build/tv_ecu.hex
            ECU_Firmware/build/tv_ecu.bin
            ECU_Firmware/build/tv_ecu.map

  host-tests:
    name: Host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: ECU_Firmware
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build and test
        run: |
          cmake --preset sim
          cmake --build build-sim
          ctest --preset sim

  motor-interop:
    name: Real motor controller firmware against the ECU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the motor controller firmware
        run: git clone --depth 1 --branch foc-firmware https://github.com/JamesGossy/stm32_motor_controller.git ../mc
      - name: Build and run
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          make test MC_DIR=../mc/controller_firmware

  hil-laps:
    name: Simulator lap matrix through the ECU firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the simulator
        run: git clone --depth 1 https://github.com/JamesGossy/Formula-Student-Autonomous-Sim.git ../sim
      - name: Build ecu_sim
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          make sim
      - name: Drive both tracks
        working-directory: ../sim
        run: ECU_SIM=$GITHUB_WORKSPACE/ECU_Firmware/build-sim/ecu_sim make test-hil PYTHON=python3
